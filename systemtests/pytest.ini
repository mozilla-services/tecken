[pytest]
testpaths = tests/
addopts =
    -v
    -rsxX
    --showlocals
    --tb=native
    -p no:django
    -p no:fillmore
    -p no:markus
    -p no:requests_mock
log_cli = false
log_cli_level = INFO
log_cli_format = %(levelname)s %(message)s

# Transform all warnings into errors
filterwarnings =
    error
    # Google warns about Python 3.11 reaching end of life.
    ignore:You are using a Python version .*which Google will stop supporting in new releases of google\.:FutureWarning:google\.api_core\._python_version_support
